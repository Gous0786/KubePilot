name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make wrapper executable
        run: chmod +x ./mvnw

      # Runs unit tests, the ArchUnit boundary checks, and the golden analyzer
      # tests. Deliberately needs no Kubernetes cluster: analyzers operate on
      # fixtures, and anything touching the fabric8 client uses Dev Services or
      # @WithKubernetesTestServer.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

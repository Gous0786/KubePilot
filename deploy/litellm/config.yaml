# Models KubePilot can use. Add entries here, then restart LiteLLM.
#
# model_name is the alias KubePilot asks for and must describe a ROLE, never a vendor.
# Swapping the model behind a role is then a change to this file alone -- KubePilot
# never learns which vendor served the request.
#
# The full provider list is at https://docs.litellm.ai/docs/providers

model_list:

  - model_name: kubepilot-fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # - model_name: kubepilot-fast
  #   litellm_params:
  #     model: ollama/qwen3:8b
  #     api_base: http://ollama:11434

  # Uncomment and set OPENAI_API_KEY in .env to enable.
  # - model_name: kubepilot-deep
  #   litellm_params:
  #     model: openai/gpt-5
  #     api_key: os.environ/OPENAI_API_KEY

  # - model_name: kubepilot-deep
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Silently drop parameters a given backend does not understand rather than erroring.
  # Not optional: the Quarkus OpenAI client always sends frequency_penalty (its default is 0,
  # not unset), and Gemini's OpenAI-compatible endpoint rejects the field outright with a 400.
  drop_params: true
  request_timeout: 120

general_settings:
  # Callers must present this as their API key. Without it, anything that can reach
  # port 4000 can spend your provider credits.
  master_key: os.environ/LITELLM_MASTER_KEY

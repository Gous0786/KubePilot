quarkus:
  application:
    name: kubepilot

  http:
    port: 8080

  # The fabric8 client picks up ~/.kube/config automatically outside a cluster, and the
  # mounted service-account token when running inside one. No explicit config needed for
  # local development against a kind cluster.
  kubernetes-client:
    trust-certs: false

  # Diagnoses are cached on the finding fingerprints of a workload, not on the prompt text.
  # Prompt bytes carry restartCount and finishedAt, which change on every scan, so a
  # payload-keyed cache would never hit. The TTL bounds how stale an unchanged-looking
  # problem may get. Ten minutes is short enough that a changed exit code or termination
  # reason surfaces quickly, since those do not alter the fingerprint.
  cache:
    caffeine:
      diagnosis:
        expire-after-write: 10M
        maximum-size: 500

  # Speaks the OpenAI HTTP dialect, which Ollama, vLLM, Groq, Azure and LiteLLM all accept.
  # The provider is therefore a URL, not a code change. Point base-url at LiteLLM to route
  # centrally, or straight at Ollama's /v1 during development.
  # model-name is a LiteLLM alias naming a ROLE, never a vendor model.
  langchain4j:
    openai:
      base-url: ${KUBEPILOT_LLM_URL:http://localhost:4000/v1}
      api-key: ${KUBEPILOT_LLM_KEY:sk-kubepilot-local}
      chat-model:
        model-name: ${KUBEPILOT_LLM_MODEL:kubepilot-fast}
        temperature: 0.2
      timeout: 60s

# ---------------------------------------------------------------------------
# KubePilot's own configuration. Read via an @ConfigMapping interface rather
# than scattered @ConfigProperty injections -- see docs/architecture.md.
# ---------------------------------------------------------------------------
kubepilot:
  scan:
    # Empty means every namespace the credential is allowed to read.
    default-namespace: ""
    include-events: true
    # Evidence budget: uncapped logs are what make tools like this slow and expensive.
    max-log-lines: 100
    max-events-per-resource: 10

  analyzers:
    # Empty means "all registered analyzers". Populate to run a subset,
    # e.g. [pod, deployment, service]. Severities and thresholds belong in
    # src/main/resources/analyzers/rules.yaml so tuning needs no recompile.
    enabled: []

  ai:
    # M1 is deliberately rules-only. Detection must not depend on an LLM.
    enabled: false

"%dev":
  quarkus:
    log:
      category:
        "io.kubepilot":
          level: DEBUG
    langchain4j:
      openai:
        log-requests: true
        log-responses: true

"%test":
  kubepilot:
    ai:
      enabled: false

# ---------------------------------------------------------------------------
# Added at later milestones -- kept here as a map, not as live config, so the
# build stays clean until the matching extension and code exist.
#
# M2  quarkus.langchain4j.*            LLM provider (ollama in dev, openai in prod)
#     quarkus.cache.caffeine.*         diagnosis cache, keyed on finding fingerprint
# M3  quarkus.otel.*                   tracing; span per analyzer and per LLM call
#     quarkus.micrometer.*             counter per ruleId
# M6  quarkus.datasource.*             scan history
#     quarkus.flyway.*                 schema migration
# ---------------------------------------------------------------------------
